<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102f31">
  <title>进步地图 · Pathwise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="redesign.css">
</head>
<body class="map-page">
  <header class="map-topbar"><a class="logo" href="index.html"><b>P</b><span>pathwise</span><small>career companion</small></a><a class="map-back" href="career.html">← 返回职业规划</a></header>
  <main class="map-shell">
    <section class="map-intro">
      <span class="kicker">YOUR LIVING PATH</span>
      <h1>你的进步，<br><em>正在地图上发生。</em></h1>
      <p>这里不是一张静态路线图。每次新经历都会让 AI 重绘道路；每项真实成果，都会把你向目标推进一站。</p>
      <div class="map-legend"><span><i class="done"></i>已走过</span><span><i class="now"></i>当前位置</span><span><i></i>等待抵达</span></div>
    </section>
    <section class="career-map" aria-label="职业进步地图">
      <svg class="map-terrain" viewBox="0 0 1200 720" role="img" aria-label="从职业画像出发，经过行动与证据站点，抵达毕业目标的路线">
        <defs>
          <linearGradient id="mapLand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef5e9"/><stop offset="1" stop-color="#dcebdd"/></linearGradient>
          <filter id="softShadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1d5544" flood-opacity=".16"/></filter>
        </defs>
        <rect width="1200" height="720" rx="28" fill="url(#mapLand)"/>
        <g class="contours" fill="none" stroke="#9ebda7" stroke-width="2" opacity=".34">
          <path d="M-40 160C180 20 300 210 520 92S870 30 1240 150"/><path d="M-50 205C190 65 310 255 535 138S890 78 1250 195"/><path d="M-50 620C180 480 330 675 555 555S900 475 1250 610"/><path d="M-30 665C200 530 350 720 575 600S920 520 1240 660"/>
        </g>
        <g class="map-water" fill="none" stroke="#a5cfcc" stroke-width="22" opacity=".45"><path d="M1040 -20C950 130 1120 250 1015 390S960 610 1100 750"/></g>
        <g class="map-forest" fill="#6f9b79" opacity=".32"><circle cx="155" cy="160" r="17"/><circle cx="185" cy="180" r="13"/><circle cx="1000" cy="155" r="16"/><circle cx="1030" cy="180" r="12"/><circle cx="190" cy="610" r="16"/><circle cx="225" cy="592" r="12"/></g>
        <path class="route-shadow" d="M100 570 C180 650 270 590 300 485 S420 330 515 405 S650 520 720 400 S825 190 920 245 S1020 360 1100 155"/>
        <path id="routeBase" class="route-base" d="M100 570 C180 650 270 590 300 485 S420 330 515 405 S650 520 720 400 S825 190 920 245 S1020 360 1100 155"/>
        <path id="routeDone" class="route-done" d="M100 570 C180 650 270 590 300 485 S420 330 515 405 S650 520 720 400 S825 190 920 245 S1020 360 1100 155"/>
        <g id="mapNodes"></g>
        <g id="traveler" class="traveler" filter="url(#softShadow)"><circle r="21"/><text y="5" text-anchor="middle">·ᴗ·</text><path d="M-7 27L0 36 7 27"/></g>
      </svg>
      <div class="map-compass"><span>N</span><i></i></div>
      <div class="map-stage-label stage-one">起步原野</div><div class="map-stage-label stage-two">能力山谷</div><div class="map-stage-label stage-three">目标高地</div>
    </section>
    <aside class="map-detail" id="mapDetail" aria-live="polite"><button id="mapDetailClose" type="button" aria-label="收起站点详情">×</button><span class="kicker" id="mapDetailKicker">CURRENT STOP</span><h2 id="mapDetailTitle">正在读取你的路径</h2><p id="mapDetailWhy">职业规划生成后，行动会自动铺成一条可行走的路线。</p><div id="mapDetailBody"></div><a id="mapDetailAction" href="career.html#route">回到规划完成这一步 →</a></aside>
  </main>
  <script src="map.js"></script>
</body>
</html>
